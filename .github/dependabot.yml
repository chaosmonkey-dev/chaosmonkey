version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /extensions/chaosmonkey-telemetry
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      telemetry-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # pint 1.32+ requires PHP ^8.3; project targets 8.2. Revisit if the
      # PHP requirement is raised.
      - dependency-name: laravel/pint
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    # Runtime base-image majors (PHP, Node) are deliberately manual: they
    # require a compatibility pass, not a routine bump.
    ignore:
      - dependency-name: php
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]
