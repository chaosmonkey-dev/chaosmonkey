name: Release

# Publication is deliberate-only: a published GitHub Release, or an explicit
# manual dispatch with a version argument. Nothing pushes images on ordinary
# branch activity.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0), without the leading v'
        required: true
        type: string

env:
  IMAGE: ghcr.io/chaosmonkey-dev/chaosmonkey

jobs:
  # Native-amd64 build + smoke gate: the image must boot and answer /up
  # before anything is pushed to the registry.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chaosmonkey:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name cm -p 8080:80 chaosmonkey:smoke
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/up >/dev/null 2>&1; then
              echo "container healthy"; exit 0
            fi
            sleep 2
          done
          docker logs cm
          echo "container did not become healthy"; exit 1

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          MAJOR_MINOR="$(echo "$V" | cut -d. -f1-2)"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.major_minor }}

      - name: Image digest
        run: |
          echo "Published ${{ env.IMAGE }}:${{ steps.version.outputs.version }}"
          echo "Multi-arch digest: ${{ steps.build.outputs.digest }}"
