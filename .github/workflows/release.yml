name: Release

# Publication is deliberate-only: a published GitHub Release, or an explicit
# manual dispatch with a version argument. Nothing pushes images on ordinary
# branch activity.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.2), without the leading v'
        required: true
        type: string

env:
  IMAGE: ghcr.io/chaosmonkey-dev/chaosmonkey

jobs:
  # Native-amd64 build + smoke gate: the image must boot and answer /up
  # before anything is pushed to the registry.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chaosmonkey:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name cm -p 8080:80 chaosmonkey:smoke
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/up >/dev/null 2>&1; then
              echo "container healthy"; exit 0
            fi
            sleep 2
          done
          docker logs cm
          echo "container did not become healthy"; exit 1

  # Multi-arch: each platform builds on a NATIVE runner (arm64 on
  # ubuntu-24.04-arm — free for public repos). Emulating the arm64 build
  # under QEMU exceeded the 6h job limit; native builds are bounded by the
  # same cost as the amd64 smoke job. Per-platform tags are merged into the
  # release manifest list by the `merge` job.
  publish:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          MAJOR_MINOR="$(echo "$V" | cut -d. -f1-2)"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}

      - name: Platform digest
        run: 'echo "${{ matrix.platform }} digest: ${{ steps.build.outputs.digest }}"'

  # Merges the per-platform manifests into the released tags.
  merge:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          MAJOR_MINOR="$(echo "$V" | cut -d. -f1-2)"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge platform manifests into release tags
        run: |
          V="${{ steps.version.outputs.version }}"
          MM="${{ steps.version.outputs.major_minor }}"
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${V}" \
            -t "${{ env.IMAGE }}:${MM}" \
            "${{ env.IMAGE }}:${V}-amd64" \
            "${{ env.IMAGE }}:${V}-arm64"

      - name: Image digest
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "Published ${{ env.IMAGE }}:${V}"
          docker buildx imagetools inspect "${{ env.IMAGE }}:${V}"
