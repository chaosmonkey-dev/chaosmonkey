worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16m;

    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 80;
        server_name _;

        # Frontend SPA (built Vue dist)
        root /var/www/frontend/dist;
        index index.html;

        # Laravel API — anything not a real file goes to the front controller
        location /api {
            root /var/www/backend/public;
            try_files $uri @laravel;
        }

        # Laravel health endpoint
        location = /up {
            root /var/www/backend/public;
            try_files $uri @laravel;
        }

        location @laravel {
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_read_timeout 60s;
        }

        # SPA assets — long cache for fingerprinted files
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Never cache the SPA shell
        location = /index.html {
            add_header Cache-Control "no-store";
        }
    }
}
