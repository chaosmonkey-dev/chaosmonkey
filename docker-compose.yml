services:
  chaosmonkey:
    # Uses the published image by default; uncomment `build: .` to build from source.
    image: ghcr.io/chaosmonkey-dev/chaosmonkey:0.1.0
    # build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - chaosmonkey-data:/data
    environment:
      # Public URL users will visit — set before first login/OAuth setup
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8080}
      # Optional integrations — leave unset to run fully local
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
    restart: unless-stopped

volumes:
  chaosmonkey-data:
